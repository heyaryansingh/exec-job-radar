name: Validate companies

# Run this by hand after editing config/companies.yaml. It checks every company's
# career site and writes data/health.json; the log lists any entry that failed.
on:
  workflow_dispatch: {}
  push:
    paths: ["config/companies.yaml"]

permissions:
  contents: write

concurrency:
  group: collect          # shares the data branch with the hourly collector
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Restore the role database from the data branch
        run: bash tools/data_branch.sh restore
      - name: Check every company
        run: python -m collector.run --validate
      - name: Save health report to the data branch
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          bash tools/data_branch.sh save

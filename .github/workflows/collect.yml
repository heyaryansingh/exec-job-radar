name: Collect roles

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (6:17 AM ET run lands before the 7:30 AM Claude run)
  workflow_dispatch: {}        # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        run: python -m collector.run --workers 16
      - name: Commit results
        if: always()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "push failed, retrying ($i)"; sleep $((i * 10))
          done
          exit 1

name: Discover (test)

# Small-scale test of discovery changes. Runs on the short list in
# config/discover_test.txt in report-only mode: the watchlist is never changed.
# Results: data/test_reports/discover.md and data/test_reports/directory_stats.txt
on:
  workflow_dispatch: {}
  push:
    paths: ["config/discover_test.txt", "tools/discover.py", "tools/ats_directory.py",
            ".github/workflows/discover-test.yml"]

permissions:
  contents: write

concurrency:
  group: discover-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Measure the Common Crawl index (no download)
        run: |
          mkdir -p data/test_reports
          timeout 1200 python -u tools/ats_directory.py --stats --crawls 1 2>&1 | tee data/test_reports/directory_stats.txt || true
      - name: Discovery on the test list (report only)
        run: python tools/discover.py config/discover_test.txt --dry-run --report data/test_reports/discover.md
      - name: Save reports
        if: always()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          for f in data/test_reports; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test report: discovery"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

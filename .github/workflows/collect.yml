name: Collect roles

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (6:17 AM ET run lands before the 7:30 AM Claude run)
  workflow_dispatch: {}        # "Run workflow" button
  push:                        # re-run right away when the code or search rules change
    branches: [main]
    paths: ["config/search.yaml", "config/companies.yaml", "config/readme_header.md"]
    # (collector code changes are tested by "Collect (test)" first and take effect on the next hourly run)
  workflow_run:                # and as soon as discovery adds companies
    workflows: ["Discover companies"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the role database from the data branch
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          bash tools/data_branch.sh restore
      - name: Collect
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m collector.run --workers 24
      - name: Save the role database (data branch, no history)
        if: always()
        run: bash tools/data_branch.sh save
      - name: Commit readable pages
        if: always()
        run: |
          # only the readable pages go on main; the JSON lives on the data branch
          git add README.md data/*.md data/daily 2>/dev/null || true
          git rm -q --cached --ignore-unmatch data/roles.json data/latest.json data/apply_queue.json \
            data/state.json data/health.json data/board_names.json data/auto_boards.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "push failed, retrying ($i)"; sleep $((i * 10))
          done
          exit 1

# Company watchlist. The collector reads each company's own career site directly.
#
# Fields:
#   name    display name
#   ats     greenhouse | lever | ashby | smartrecruiters | workday | oracle
#   slug    board name (greenhouse/lever/ashby/smartrecruiters)
#   host, site   Workday or Oracle career-site host and site id
#   tier    1 = top tier, 2 = strong, 3 = other (feeds the score)
#   sector  free text, shown on the dashboard
#   disabled: true   to pause an entry
#
# Easiest way to add a company: open one of its job postings in a browser, copy the
# URL, and run   python tools/add_company.py "<url>" "Company Name" 1 bank
# Entries were seeded from known career-site addresses; run the "Validate companies"
# GitHub Action to see which ones respond, and fix or disable failures.


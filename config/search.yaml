pay:
  min_annual: 200000      # drop roles whose posted range tops out below this
  drop_if_unknown: false  # most senior postings omit pay; keep them and let Claude judge

location:
  us_only: true
  allow_remote: true
  # Leave allowed_places empty to accept anywhere in the US (open to relocation).
  # To restrict, list cities/states, e.g. [houston, texas, tx, remote].
  allowed_places: []
  preferred: [houston, texas, ", tx", remote]   # small score bonus

# Companies never to show (e.g. a current employer during a confidential search).
excluded_companies: []

# Broad sweep of Indeed + Google Jobs for employers not on the watchlist.
boards:
  enabled: true
  sites: [indeed]   # google and zip_recruiter returned nothing in tests; LinkedIn is not scraped
  hours_old: 24
  results_per_search: 40
  locations: ["United States"]
  search_terms:
    - Vice President Cloud Infrastructure
    - VP Platform Engineering
    - Head of Site Reliability Engineering
    - Director Cloud Engineering
    - Senior Director Infrastructure
    - VP Technology Infrastructure
    - Head of Enterprise Architecture
    - Chief Technology Officer
    - VP AI Platform
    - Executive Director Technology
    - Managing Director Technology Infrastructure
    - Director Production Engineering

# Job aggregators with official APIs (collector/aggregators.py). Adzuna needs a free key:
# add repo secrets ADZUNA_APP_ID and ADZUNA_APP_KEY (Settings > Secrets > Actions).
aggregators:
  themuse:
    enabled: false   # API returns totals but no items as of 2026-10-19; retest before enabling
    pages: 15
  adzuna:
    enabled: true    # runs only once ADZUNA_APP_ID / ADZUNA_APP_KEY secrets are set
    pages: 4
    max_days_old: 3
    category: it-jobs

# The universe: also poll every other known career site (Common Crawl directory plus
# employer sites found through job boards), not just config/companies.yaml.
universe:
  enabled: true      # tested 2026-10-19: 570/600 sample boards answered, ~5 min

# Focus locations: their own README section and apply-queue tag, extra job-board searches,
# and a looser domain filter so senior IT roles at local employers aren't missed.
focus_locations:
  - name: Houston
    emoji: "🤠"
    # Houston metro (regex, case-insensitive, matched against the role's location)
    match: '\b(houston|the woodlands|katy|sugar land|spring, (tx|texas)|cypress, (tx|texas)|pearland|humble|pasadena, (tx|texas)|baytown|league city|conroe|tomball|bellaire|stafford, (tx|texas)|missouri city|friendswood|kingwood|clear lake|webster, (tx|texas)|deer park|richmond, (tx|texas)|rosenberg|galveston)\b'
    description_min_hits: 2        # vs 4 elsewhere
    board_location: "Houston, TX"
    board_radius_miles: 50
    board_hours_old: 72
    board_terms:
      - Director Information Technology
      - Vice President Technology
      - Head of IT
      - Chief Information Officer
      - Director Infrastructure
      - Director Cloud
      - Director Enterprise Architecture
      - Director Data Analytics
      - VP Digital Transformation
      - Director Cybersecurity
      - IT Director Energy
      - Executive Director Technology
    jsearch_queries:
      - technology director in Houston, TX
      - vice president information technology in Houston, TX
